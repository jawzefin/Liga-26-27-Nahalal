.ic.on{background:var(--acc)}.ic.on svg{stroke:var(--on)}.ic[disabled]{opacity:.3;pointer-events:none}

.ico{display:flex;gap:8px}

 <div class="lgd"><span><i class="f"></i>בית</span><span><i></i>חוץ</span></div></div><div class="sc">${card}</div>`;

function settings(q=""){
 const list=TEAMS.filter(t=>nm(t).includes(q));
 $("app").innerHTML=`<div><h2 class="h2">הקבוצה שלי</h2><p class="sub">המשחק של הקבוצה הזאת יופיע ראשון בכל מחזור ובלוח השנה.</p></div>
 <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="חיפוש קבוצה" value="${q}"></label>
 <div class="cl">${list.map(t=>`<button class="${t===ME?"on":""}" data-t="${t.replace(/"/g,"&quot;")}"><span class="rd"></span>${logo(t)}<span class="n">${nm(t)}</span>${zp(t)}</button>`).join("")||'<div class="empty">לא נמצאו קבוצות</div>'}</div>`;
 document.querySelectorAll(".cl button").forEach(b=>b.onclick=()=>{ME=b.dataset.t;try{localStorage.setItem("team",ME)}catch(e){}calM=null;settings(q)});
 const i=$("q");i.oninput=()=>{const p=i.selectionStart;settings(i.value);$("q").focus();$("q").setSelectionRange(p,p)};

function route(){

route();

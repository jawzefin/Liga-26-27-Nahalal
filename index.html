<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b1c">
<title>נהלל · ליגה 26/27</title>
<style>
:root{--bg:#070b1c;--bg2:#0f1530;--card:#121936;--ink:#f4f6ff;--mute:#8a93b8;--line:#1f2850;--acc:#38d27a;--gold:#ffc83d}
@media(prefers-color-scheme:light){:root{--bg:#f2f4fb;--bg2:#fff;--card:#fff;--ink:#0d1330;--mute:#6a7396;--line:#e1e5f2;--acc:#15a85a;--gold:#e0a200}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.3 -apple-system,system-ui,"Segoe UI",Arial,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:2;background:linear-gradient(var(--bg2),var(--bg));padding:env(safe-area-inset-top) 0 0}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 8px}
.top button{all:unset;width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:1.4rem;cursor:pointer;border:1px solid var(--line)}
.top button:disabled{opacity:.3}
.ttl{text-align:center}.ttl h1{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.5px}.ttl p{margin:2px 0 0;color:var(--mute);font-size:.85rem}
.strip{display:flex;gap:8px;overflow-x:auto;padding:6px 12px 12px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.strip a{flex:none;min-width:40px;text-align:center;padding:7px 10px;border-radius:20px;background:var(--card);border:1px solid var(--line);color:var(--mute);font-weight:600;font-size:.9rem;cursor:pointer}
.strip a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:560px;margin:auto;padding:4px 16px 48px}
.day{display:flex;justify-content:center;gap:6px;color:var(--mute);font-weight:600;padding:12px 0 10px;font-size:.95rem}
.g{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:4px;padding:18px 0;border-top:1px solid var(--line)}
.tm{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:.92rem;font-weight:600;line-height:1.2;word-break:break-word}
.lg.img{background:none;overflow:visible}.lg img{width:100%;height:100%;object-fit:contain}.lg{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1rem;color:#fff;position:relative}
.mid{align-self:center;text-align:center;color:var(--mute);font-weight:700;font-size:.8rem;min-width:44px}
.mid i{display:block;font-style:normal;font-size:1.1rem;color:var(--ink)}
.me{background:var(--card);border:1px solid var(--acc);border-radius:20px;padding:18px 8px;margin:4px 0 8px}
.me .tm.us{color:var(--acc);font-size:1rem}
.star{position:absolute;top:-6px;inset-inline-end:-6px;font-size:1.05rem;color:var(--gold);filter:drop-shadow(0 0 4px #0008)}
.chip{display:inline-block;margin-top:4px;padding:2px 9px;border-radius:10px;background:var(--acc);color:#04210f;font-size:.7rem;font-weight:800}
.lbl{color:var(--mute);font-size:.8rem;margin:10px 0 0;font-weight:600}
</style></head><body>

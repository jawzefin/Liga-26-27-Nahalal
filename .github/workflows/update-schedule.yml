name: Update schedule

on:
  schedule:
    - cron: "7 */3 * * *" # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/lib.test.mjs
      # exits 1 (and leaves data/schedule.json untouched) if the API data fails validation
      - run: node scripts/update-schedule.mjs
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- data/schedule.json)" ]; then
            echo "no change"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/schedule.json
            git commit -m "Update schedule from API"
            git push
          fi
